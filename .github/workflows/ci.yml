name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "true"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.select.outputs.full }}
      tag: ${{ steps.select.outputs.tag }}
      native: ${{ steps.select.outputs.native }}
      homebrew: ${{ steps.select.outputs.homebrew }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Select checks
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]] &&
             ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || echo "Base unavailable; using full CI."
          fi
          python3 -m tooling.release.ci_plan

  documentation-checks:
    needs: plan
    if: needs.plan.outputs.full == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check required README files
        run: |
          test -s README.md
          test -s README_PYPI.md
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.31"
          enable-cache: false
      - name: Check spelling with the locked tool version
        shell: bash
        run: |
          version=$(python3 -c 'import pathlib, tomllib; lock = tomllib.loads(pathlib.Path("uv.lock").read_text()); print(next(p["version"] for p in lock["package"] if p["name"] == "typos"))')
          uv tool run --from "typos==$version" typos .

  python-checks:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        id: setup
        uses: ./.github/actions/setup-python
      - name: Validate GitHub workflows
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Ruff lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run ruff check src tests tooling
      - name: Pylint duplication and nesting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pylint src/ethernity tooling
      - name: Ruff format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run ruff format --check src tests tooling
      - name: Pyrefly
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          for platform in linux darwin win32; do
            uv run pyrefly check --python-platform "$platform" --output-format=github
          done
      - name: Typos
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run typos .

  kit-lint:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup kit dependencies
        uses: ./.github/actions/setup-kit
      - name: Biome lint
        working-directory: kit
        run: npm run lint
      - name: Biome format check
        working-directory: kit
        run: npm run format:check
      - name: Verify local browser client
        working-directory: browser
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm test
          npm run check

  render-visual:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    name: render-visual (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [pdf, terminal]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Install Poppler
        if: matrix.suite == 'pdf'
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Verify responsive PDF matrix
        if: matrix.suite == 'pdf'
        run: |
          uv run python scripts/render_visual_baselines.py \
            --output-dir "${RUNNER_TEMP}/render-visual-baselines" \
            --rasterize never
      - name: Verify terminal snapshots
        if: matrix.suite == 'terminal'
        run: uv run python -m tooling.check_tests visual
      - name: Summarize test timings
        if: always() && matrix.suite == 'terminal'
        shell: bash
        run: uv run python scripts/summarize_test_timings.py test-results >> "$GITHUB_STEP_SUMMARY"
      - name: Upload snapshot results
        if: always() && matrix.suite == 'terminal'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-snapshot-results
          path: |
            test-results/visual.xml
            tests/visual/snapshots/*.received.svg
          retention-days: 7

  portability:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"
      - name: Check Linux portability on minimum Python
        run: uv run python -m tooling.check_tests portability
      - name: Summarize test timings
        if: always()
        shell: bash
        run: uv run python scripts/summarize_test_timings.py test-results >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }}, ${{ matrix.suite }})
    needs: [plan, kit-bundles]
    if: needs.plan.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        suite: [core, rendering, ui-1, ui-2]
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download generated kit bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recovery-kit-bundles
          path: src/ethernity/resources/kit
      - name: Download kit loader roundtrip references
        if: matrix.suite == 'core'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recovery-kit-packed
          path: kit/dist
      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poppler for composited QR tests
        if: matrix.os == 'ubuntu-latest' && matrix.suite == 'rendering'
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Setup kit dependencies
        if: matrix.suite == 'core'
        uses: ./.github/actions/setup-kit

      - name: Run Python tests
        if: matrix.os != 'ubuntu-latest'
        run: uv run python -m tooling.check_tests ${{ matrix.suite }}
      - name: Run Python tests with coverage
        id: coverage-tests
        if: matrix.os == 'ubuntu-latest'
        run: uv run python -m tooling.check_tests ${{ matrix.suite }} --coverage
      - name: Upload coverage data
        if: ${{ !cancelled() && steps.coverage-tests.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-${{ matrix.suite }}
          path: test-results/.coverage.${{ matrix.suite }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Summarize test timings
        if: always()
        shell: bash
        run: uv run python scripts/summarize_test_timings.py test-results >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-tests-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.suite }}
          path: test-results/${{ matrix.suite }}.xml
          retention-days: 7

  coverage:
    needs: [plan, test]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.14"
      - name: Download core coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-coverage-core
          path: coverage-data
      - name: Download first UI group coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-coverage-ui-1
          path: coverage-data
      - name: Download second UI group coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-coverage-ui-2
          path: coverage-data
      - name: Download rendering coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-coverage-rendering
          path: coverage-data
      - name: Combine coverage and enforce both gates without rerunning tests
        run: uv run python -m tooling.check_tests coverage --results-dir coverage-data

  e2e:
    needs: [plan, kit-bundles]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download generated kit bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recovery-kit-bundles
          path: src/ethernity/resources/kit
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Run e2e tests
        run: uv run python -m tooling.check_tests e2e
      - name: Summarize test timings
        if: always()
        shell: bash
        run: uv run python scripts/summarize_test_timings.py test-results >> "$GITHUB_STEP_SUMMARY"
      - name: Upload end-to-end test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: end-to-end-test-results
          path: test-results/e2e.xml
          retention-days: 7

  kit-bundles:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify generated bundles are not committed
        run: |
          TRACKED="$(git ls-files -- \
            "src/ethernity/resources/kit/*.html")"
          if [ -n "$TRACKED" ]; then
            echo "ERROR: recovery kit bundles are generated release files and must not be committed."
            echo "$TRACKED"
            exit 1
          fi
      - name: Setup kit dependencies
        uses: ./.github/actions/setup-kit
      - name: Generate kit bundles for packages
        working-directory: kit
        run: node build_kit.mjs
      - name: Verify generated kit bundles
        run: python3 -m tooling.release_resources --kit-directory src/ethernity/resources/kit

      - name: Upload generated kit bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-kit-bundles
          path: src/ethernity/resources/kit/*.html
          if-no-files-found: error
          retention-days: 30

      - name: Upload kit loader roundtrip references
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-kit-packed
          path: kit/dist/*.packed.html
          if-no-files-found: error
          retention-days: 30

  native-packages:
    if: needs.plan.outputs.native == 'true'
    # Let Homebrew request its runners after source staging, before native builds
    # compete with the test matrix for the total and macOS runner limits.
    needs: [plan, kit-bundles, package]
    uses: ./.github/workflows/native-packages.yml
    with:
      commit_sha: ${{ github.sha }}
      tag: ${{ needs.plan.outputs.tag }}
      kit_artifact: recovery-kit-bundles

  package:
    needs: [plan, kit-bundles]
    if: needs.plan.outputs.full == 'true'
    uses: ./.github/workflows/python-packages.yml
    with:
      commit_sha: ${{ github.sha }}
      tag: ${{ needs.plan.outputs.tag }}
      kit_artifact: recovery-kit-bundles
      stage_homebrew: ${{ needs.plan.outputs.homebrew == 'true' }}

  homebrew-rehearsal:
    if: needs.plan.outputs.homebrew == 'true'
    needs: [plan, package, kit-bundles]
    uses: ./.github/workflows/homebrew-build.yml
    with:
      formula_artifact: homebrew-rehearsal-formula
      tap_name: MinorGlitch/rehearsal
      source_artifact: release-source

  kit-verify:
    needs: [plan, kit-bundles]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # Match the Playwright version in kit/package-lock.json. The image includes
      # its browser binaries and system libraries, so CI needs no apt downloads.
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup kit dependencies
        uses: ./.github/actions/setup-kit

      - name: Setup Python for bundle verification
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download generated kit bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recovery-kit-bundles
          path: src/ethernity/resources/kit

      - name: Verify build output
        run: python3 -m tooling.release_resources --kit-directory src/ethernity/resources/kit

      - name: Run kit tests
        working-directory: kit
        run: npm test

      - name: Smoke generated recovery kits in Chromium and WebKit
        working-directory: kit
        run: npm run test:browser
      - name: Verify local browser input and rendering
        working-directory: browser
        run: |
          npm ci
          npm run test:browser

  python-audit:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Export locked runtime, development, and build dependencies
        run: |
          uv export \
            --locked \
            --all-extras \
            --all-groups \
            --no-emit-project \
            --format requirements-txt \
            --output-file "${RUNNER_TEMP}/audit-requirements.txt"
      - name: Audit locked dependencies
        run: |
          uv run pip-audit \
            --require-hashes \
            --disable-pip \
            --requirement "${RUNNER_TEMP}/audit-requirements.txt"

  npm-audit:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: kit/package-lock.json
      - name: Audit npm dependencies
        working-directory: kit
        run: npm audit --audit-level=low
      - name: Audit local browser dependencies
        working-directory: browser
        run: npm audit --audit-level=low

  ci-gate:
    if: ${{ always() }}
    needs:
      - plan
      - documentation-checks
      - python-checks
      - kit-lint
      - render-visual
      - portability
      - test
      - coverage
      - e2e
      - kit-bundles
      - package
      - native-packages
      - homebrew-rehearsal
      - kit-verify
      - python-audit
      - npm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require all selected checks to succeed
        env:
          NEEDS_CONTEXT: ${{ toJSON(needs) }}
        run: python3 -m tooling.release.ci_plan gate
