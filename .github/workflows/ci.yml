name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "true"

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        id: setup
        uses: ./.github/actions/setup-python
      - name: Validate GitHub workflows
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Ruff lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run ruff check src tests tooling
      - name: Pylint duplication and nesting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pylint src/ethernity tooling
      - name: Ruff format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run ruff format --check src tests tooling
      - name: Pyrefly
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pyrefly check --output-format=github
      - name: Typos
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run typos .

  kit-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup kit dependencies
        uses: ./.github/actions/setup-kit
      - name: Biome lint
        working-directory: kit
        run: npm run lint
      - name: Biome format check
        working-directory: kit
        run: npm run format:check

  render-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Verify responsive PDF matrix
        run: |
          uv run python scripts/render_visual_baselines.py \
            --output-dir "${RUNNER_TEMP}/render-visual-baselines" \
            --rasterize never
      - name: Verify terminal snapshots
        run: uv run pytest tests/visual -n 2 -v --durations=30 --junitxml=test-results/visual.xml
      - name: Summarize test timings
        if: always()
        shell: bash
        run: uv run python scripts/summarize_test_timings.py test-results >> "$GITHUB_STEP_SUMMARY"
      - name: Upload snapshot results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-snapshot-results
          path: |
            test-results/visual.xml
            tests/visual/snapshots/*.received.svg
          retention-days: 7

  portability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"
      - name: Check Linux portability on minimum Python
        run: uv run pytest tests/unit tests/ui tests/rendering tests/integration -m portability -q --junitxml=test-results/portability.xml
      - name: Summarize test timings
        if: always()
        shell: bash
        run: uv run python scripts/summarize_test_timings.py test-results >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: kit-bundles
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download generated kit bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recovery-kit-bundles
          path: src/ethernity/resources/kit
      - name: Download kit loader roundtrip references
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recovery-kit-packed
          path: kit/dist
      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poppler for composited QR tests
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Setup kit dependencies
        uses: ./.github/actions/setup-kit

      - name: Run Python tests
        if: matrix.os != 'ubuntu-latest'
        run: uv run pytest tests/unit tests/ui tests/rendering tests/integration -n 2 --dist loadfile -v --durations=30 --junitxml=test-results/python.xml
      - name: Run Python tests with coverage
        id: coverage-tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv run pytest tests/unit tests/ui tests/rendering tests/integration -n 2 --dist loadfile \
            --cov=ethernity \
            --cov=tooling.document_inspector_app \
            --cov-report= --durations=30 --junitxml=test-results/python.xml
      - name: Check application coverage
        if: ${{ !cancelled() && steps.coverage-tests.outcome == 'success' }}
        run: uv run coverage report --include='src/ethernity/*' --fail-under=85
      - name: Check document inspector coverage
        if: ${{ !cancelled() && steps.coverage-tests.outcome == 'success' }}
        run: uv run coverage report --include='tooling/document_inspector_app/*' --fail-under=45

      - name: Summarize test timings
        if: always()
        shell: bash
        run: uv run python scripts/summarize_test_timings.py test-results >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-tests-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-results/python.xml
          retention-days: 7

  e2e:
    needs: kit-bundles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download generated kit bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recovery-kit-bundles
          path: src/ethernity/resources/kit
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Run e2e tests
        env:
          ETHERNITY_TEST_CLI_TIMEOUT_SECONDS: "300"
        run: uv run pytest tests/e2e -n 2 --dist loadfile -v --durations=30 --junitxml=test-results/e2e.xml
      - name: Summarize test timings
        if: always()
        shell: bash
        run: uv run python scripts/summarize_test_timings.py test-results >> "$GITHUB_STEP_SUMMARY"
      - name: Upload end-to-end test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: end-to-end-test-results
          path: test-results/e2e.xml
          retention-days: 7

  kit-bundles:
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      native: ${{ steps.version.outputs.native }}
      homebrew: ${{ steps.version.outputs.homebrew }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select packaging checks and read version
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -m tooling.release.ci_plan
      - name: Verify generated bundles are not committed
        run: |
          TRACKED="$(git ls-files -- \
            "src/ethernity/resources/kit/*.html")"
          if [ -n "$TRACKED" ]; then
            echo "ERROR: recovery kit bundles are generated release files and must not be committed."
            echo "$TRACKED"
            exit 1
          fi
      - name: Setup kit dependencies
        uses: ./.github/actions/setup-kit
      - name: Generate kit bundles for packages
        working-directory: kit
        run: node build_kit.mjs
      - name: Verify generated kit bundles
        run: python3 -m tooling.release_resources --kit-directory src/ethernity/resources/kit

      - name: Upload generated kit bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-kit-bundles
          path: src/ethernity/resources/kit/*.html
          if-no-files-found: error
          retention-days: 30

      - name: Upload kit loader roundtrip references
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-kit-packed
          path: kit/dist/*.packed.html
          if-no-files-found: error
          retention-days: 30

  native-packages:
    needs: kit-bundles
    uses: ./.github/workflows/native-packages.yml
    with:
      commit_sha: ${{ github.sha }}
      tag: ${{ needs.kit-bundles.outputs.tag }}
      kit_artifact: recovery-kit-bundles
      build_binaries: ${{ needs.kit-bundles.outputs.native == 'true' }}

  package:
    needs: [kit-bundles, native-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python
        with:
          extras: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source
          path: source-dist
      - name: Download the wheel verified by the native packaging workflow
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-python
          path: dist
      - name: Verify wheel and source contents
        run: python3 -m tooling.release_resources dist/*.whl source-dist/*.tar.gz
      - name: Stage Homebrew formula for native rehearsal
        env:
          RELEASE_TAG: ${{ needs.kit-bundles.outputs.tag }}
        run: |
          python3 scripts/generate_homebrew_source_formula.py \
            --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --source-archive "source-dist/ethernity-source-${RELEASE_TAG}.tar.gz" \
            --template scripts/homebrew_ethernity_tap.rb --lock uv.lock \
            --output homebrew-stage/Formula/ethernity.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-rehearsal-formula
          path: homebrew-stage
          if-no-files-found: error
          retention-days: 30

  homebrew-rehearsal:
    if: needs.kit-bundles.outputs.homebrew == 'true'
    needs: [package, kit-bundles]
    uses: ./.github/workflows/homebrew-build.yml
    with:
      formula_artifact: homebrew-rehearsal-formula
      tap_name: MinorGlitch/rehearsal
      source_artifact: release-source

  kit-verify:
    needs: kit-bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # Match the Playwright version in kit/package-lock.json. The image includes
      # its browser binaries and system libraries, so CI needs no apt downloads.
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup kit dependencies
        uses: ./.github/actions/setup-kit

      - name: Setup Python for bundle verification
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download generated kit bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recovery-kit-bundles
          path: src/ethernity/resources/kit

      - name: Verify build output
        run: python3 -m tooling.release_resources --kit-directory src/ethernity/resources/kit

      - name: Run kit tests
        working-directory: kit
        run: npm test

      - name: Smoke generated recovery kits in Chromium and WebKit
        working-directory: kit
        run: npm run test:browser

  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Export locked runtime, development, and build dependencies
        run: |
          uv export \
            --locked \
            --all-extras \
            --all-groups \
            --no-emit-project \
            --format requirements-txt \
            --output-file "${RUNNER_TEMP}/audit-requirements.txt"
      - name: Audit locked dependencies
        run: |
          uv run pip-audit \
            --require-hashes \
            --disable-pip \
            --requirement "${RUNNER_TEMP}/audit-requirements.txt"

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: kit/package-lock.json
      - name: Audit npm dependencies
        working-directory: kit
        run: npm audit --audit-level=low

  ci-gate:
    if: ${{ always() }}
    needs:
      - python-checks
      - kit-lint
      - render-visual
      - portability
      - test
      - e2e
      - kit-bundles
      - package
      - native-packages
      - homebrew-rehearsal
      - kit-verify
      - python-audit
      - npm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require all selected checks to succeed
        env:
          NEEDS_CONTEXT: ${{ toJSON(needs) }}
        run: python3 -m tooling.release.ci_plan gate
