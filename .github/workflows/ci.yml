name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        id: setup
        uses: ./.github/actions/setup-python
      - name: Ruff lint
        run: uv run ruff check src tests tooling
      - name: Pylint duplication and nesting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pylint src/ethernity tooling
      - name: Ruff format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run ruff format --check src tests tooling
      - name: Pyrefly
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run pyrefly check --output-format=github
      - name: Typos
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: uv run typos .

  kit-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: kit/package-lock.json
      - name: Install kit dependencies
        working-directory: kit
        run: npm ci
      - name: Biome lint
        working-directory: kit
        run: npm run lint
      - name: Biome format check
        working-directory: kit
        run: npm run format:check

  render-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Verify responsive PDF matrix
        run: |
          uv run python scripts/render_visual_baselines.py \
            --output-dir "${RUNNER_TEMP}/render-visual-baselines" \
            --rasterize never
      - name: Verify terminal snapshots
        run: uv run pytest tests/visual -n 2 -v --durations=30 --junitxml=test-results/visual.xml
      - name: Upload snapshot results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-snapshot-results
          path: |
            test-results/visual.xml
            tests/visual/snapshots/*.received.svg
          retention-days: 7

  portability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"
      - name: Check Linux portability on minimum Python
        run: uv run pytest tests/unit -m portability -q

  test:
    needs: kit-bundles
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Download generated kit bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recovery-kit-bundles
          path: src/ethernity/resources/kit
      - name: Download kit loader roundtrip references
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recovery-kit-packed
          path: kit/dist
      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poppler for composited QR tests
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Setup Node.js for kit interop tests
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: kit/package-lock.json
      - name: Install kit dependencies
        working-directory: kit
        run: npm ci

      - name: Run unit and integration tests
        if: matrix.os != 'ubuntu-latest'
        run: uv run pytest tests/unit tests/integration -n 2 --dist loadfile -v --durations=30 --junitxml=test-results/python.xml
      - name: Run unit and integration tests with coverage
        id: coverage-tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv run pytest tests/unit tests/integration -n 2 --dist loadfile \
            --cov=ethernity \
            --cov=tooling.document_inspector_app \
            --cov-report= --durations=30 --junitxml=test-results/python.xml
      - name: Check application coverage
        if: ${{ !cancelled() && steps.coverage-tests.outcome == 'success' }}
        run: uv run coverage report --include='src/ethernity/*' --fail-under=85
      - name: Check document inspector coverage
        if: ${{ !cancelled() && steps.coverage-tests.outcome == 'success' }}
        run: uv run coverage report --include='tooling/document_inspector_app/*' --fail-under=45

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-tests-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-results/python.xml
          retention-days: 7

  e2e:
    needs: kit-bundles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Download generated kit bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recovery-kit-bundles
          path: src/ethernity/resources/kit
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Run e2e tests
        env:
          ETHERNITY_TEST_CLI_TIMEOUT_SECONDS: "300"
        run: uv run pytest tests/e2e -n 2 --dist loadfile -v --durations=30 --junitxml=test-results/e2e.xml
      - name: Upload end-to-end test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: end-to-end-test-results
          path: test-results/e2e.xml
          retention-days: 7

  kit-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Verify generated bundles are not committed
        run: |
          TRACKED="$(git ls-files -- \
            "src/ethernity/resources/kit/*.html")"
          if [ -n "$TRACKED" ]; then
            echo "ERROR: recovery kit bundles are generated release files and must not be committed."
            echo "$TRACKED"
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: kit/package-lock.json
      - name: Install kit dependencies
        working-directory: kit
        run: npm ci
      - name: Generate kit bundles for packages
        working-directory: kit
        run: node build_kit.mjs
      - name: Verify generated kit bundles
        run: python3 -m tooling.release_resources --kit-directory src/ethernity/resources/kit

      - name: Upload generated kit bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-kit-bundles
          path: src/ethernity/resources/kit/*.html
          if-no-files-found: error
          retention-days: 1

      - name: Upload kit loader roundtrip references
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-kit-packed
          path: kit/dist/*.packed.html
          if-no-files-found: error
          retention-days: 1

  package:
    needs: kit-bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Download generated kit bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recovery-kit-bundles
          path: src/ethernity/resources/kit
      - name: Build wheel and sdist
        run: uv build --wheel --sdist --out-dir dist
      - name: Verify package contents
        run: python3 -m tooling.release_resources dist/*.whl dist/*.tar.gz
      - name: Install built wheel
        run: python3 -m pip install --force-reinstall dist/*.whl
      - name: Smoke test installed package
        run: |
          python3 -c "import ethernity, ethernity.main; print(ethernity.__file__)"
          python3 -m ethernity --help > /dev/null
          SMOKE_OUT="${RUNNER_TEMP:-/tmp}/ethernity-wheel-smoke"
          rm -rf "$SMOKE_OUT"
          mkdir -p "$SMOKE_OUT"
          python3 -m ethernity run restore \
            --scan tests/fixtures/v1_2/extension_golden/base64/gzip_replacement_chain/chain/qr_document.pdf \
            --scan tests/fixtures/v1_2/extension_golden/base64/gzip_replacement_chain/chain/extensions/01/qr_document-01-*.pdf \
            --passphrase stable-v1_2-extension-passphrase \
            --output "$SMOKE_OUT/recovered" \
            --yes
          test -d "$SMOKE_OUT/recovered"

  kit-verify:
    needs: kit-bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: kit/package-lock.json

      - name: Install kit dependencies
        working-directory: kit
        run: npm ci

      - name: Download generated kit bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recovery-kit-bundles
          path: src/ethernity/resources/kit

      - name: Verify build output
        run: python3 -m tooling.release_resources --kit-directory src/ethernity/resources/kit

      - name: Run kit tests
        working-directory: kit
        run: npm test

      - name: Smoke generated recovery kits in Chrome
        working-directory: kit
        run: npm run test:browser

  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Export locked runtime dependencies
        run: |
          uv export \
            --frozen \
            --no-dev \
            --no-emit-project \
            --format requirements-txt \
            --output-file "${RUNNER_TEMP}/runtime-requirements.txt"
      - name: Audit locked runtime dependencies
        run: |
          uv run pip-audit \
            --require-hashes \
            --no-deps \
            --requirement "${RUNNER_TEMP}/runtime-requirements.txt"

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: kit/package-lock.json
      - name: Audit npm dependencies
        working-directory: kit
        run: npm audit --audit-level=high

  ci-gate:
    if: ${{ always() }}
    needs:
      - python-checks
      - kit-lint
      - render-visual
      - portability
      - test
      - e2e
      - kit-bundles
      - package
      - kit-verify
      - python-audit
      - npm-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS_CONTEXT: ${{ toJSON(needs) }}
        run: |
          failures="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<< "$NEEDS_CONTEXT")"
          if [ -n "$failures" ]; then
            echo "Required CI jobs did not succeed:"
            echo "$failures"
            exit 1
          fi
          echo "All required CI jobs succeeded."
