name: CI

on:
  push:
    paths:
      - "src/**"
      - "kit/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "tooling/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "ethernity.spec"
      - "README_PYPI.md"
      - "LICENSE"
  pull_request:
    paths:
      - "src/**"
      - "kit/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "tooling/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/dependabot.yml"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "ethernity.spec"
      - "README_PYPI.md"
      - "LICENSE"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Ruff lint
        run: uv run ruff check src tests tooling

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Ruff format
        run: uv run ruff format --check src tests tooling

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Pyrefly
        run: uv run pyrefly check --output-format=github

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Typos
        run: uv run typos .

  kit-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: kit/package-lock.json
      - name: Install kit dependencies
        working-directory: kit
        run: npm ci
      - name: Biome lint
        working-directory: kit
        run: npm run lint
      - name: Biome format check
        working-directory: kit
        run: npm run format:check

  render-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Verify responsive PDF matrix
        run: |
          uv run python scripts/render_visual_baselines.py \
            --output-dir "${RUNNER_TEMP}/render-visual-baselines" \
            --rasterize never

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Node.js for kit interop tests
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: kit/package-lock.json
      - name: Install kit dependencies
        working-directory: kit
        run: npm ci

      - name: Run unit tests
        run: uv run pytest tests/unit -v
      - name: Run integration tests
        run: uv run pytest tests/integration -v

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Run e2e tests
        env:
          ETHERNITY_TEST_CLI_TIMEOUT_SECONDS: "300"
        run: uv run pytest tests/e2e -v

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Setup Node.js for unit coverage
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: kit/package-lock.json
      - name: Install kit dependencies
        working-directory: kit
        run: npm ci
      - name: Run tests with coverage
        run: |
          uv run pytest tests/unit tests/integration \
            --cov=ethernity \
            --cov-report=term-missing \
            --cov-fail-under=85

  tooling-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Document inspector coverage
        run: |
          uv run pytest \
            tests/unit/test_document_inspector_tool.py \
            tests/unit/test_document_inspector_app_support.py \
            --cov=tooling.document_inspector_app \
            --cov-report=term-missing \
            --cov-fail-under=45

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: kit/package-lock.json
      - name: Install kit dependencies
        working-directory: kit
        run: npm ci
      - name: Install kit gzip compressor
        run: sudo apt-get update && sudo apt-get install --yes libdeflate-tools
      - name: Generate kit bundles for package artifacts
        working-directory: kit
        run: node build_kit.mjs
      - name: Verify generated kit bundles
        run: |
          for BUNDLE in \
            src/ethernity/resources/kit/recovery_kit.bundle.html \
            src/ethernity/resources/kit/recovery_kit.scanner.bundle.html
          do
            test -s "$BUNDLE"
            SIZE=$(stat -c%s "$BUNDLE" 2>/dev/null || stat -f%z "$BUNDLE")
            echo "Generated bundle size ($BUNDLE): $SIZE bytes"
            if [ "$SIZE" -lt 1000 ]; then
              echo "ERROR: Generated bundle seems too small, may be corrupted: $BUNDLE"
              exit 1
            fi
          done
      - name: Build wheel and sdist
        run: uv build --wheel --sdist --out-dir dist
      - name: Verify package contents
        run: python3 scripts/check_wheel_contents.py dist/*.whl dist/*.tar.gz
      - name: Install built wheel
        run: python3 -m pip install --force-reinstall dist/*.whl
      - name: Smoke test installed package
        run: |
          python3 -c "import ethernity, ethernity.main; print(ethernity.__file__)"
          python3 -m ethernity --help > /dev/null
          SMOKE_OUT="${RUNNER_TEMP:-/tmp}/ethernity-wheel-smoke"
          rm -rf "$SMOKE_OUT"
          mkdir -p "$SMOKE_OUT"
          python3 -m ethernity run restore \
            --scan tests/fixtures/v1_2/extension_golden/raw/gzip_replacement_chain/chain/qr_document.pdf \
            --scan tests/fixtures/v1_2/extension_golden/raw/gzip_replacement_chain/chain/extensions/01/qr_document-01-*.pdf \
            --passphrase stable-v1_2-extension-passphrase \
            --output "$SMOKE_OUT/recovered" \
            --yes
          test -d "$SMOKE_OUT/recovered"

  kit-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: kit/package-lock.json

      - name: Verify generated bundles are not committed
        run: |
          TRACKED="$(git ls-files -- \
            src/ethernity/resources/kit/recovery_kit.bundle.html \
            src/ethernity/resources/kit/recovery_kit.scanner.bundle.html)"
          if [ -n "$TRACKED" ]; then
            echo "ERROR: recovery kit bundles are generated release artifacts and must not be committed."
            echo "$TRACKED"
            exit 1
          fi

      - name: Install kit dependencies
        working-directory: kit
        run: npm ci

      - name: Install kit gzip compressor
        run: sudo apt-get update && sudo apt-get install --yes libdeflate-tools

      - name: Generate kit bundles
        working-directory: kit
        run: node build_kit.mjs

      - name: Verify build output
        run: |
          echo "Build completed successfully"
          ls -la src/ethernity/resources/kit/recovery_kit.bundle.html
          ls -la src/ethernity/resources/kit/recovery_kit.scanner.bundle.html
          ls -la kit/dist/

      - name: Run kit tests
        working-directory: kit
        run: npm test

      - name: Smoke generated recovery kits in Chrome
        working-directory: kit
        run: npm run test:browser

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Run kit interoperability tests
        run: uv run pytest tests/unit/test_kit_vectors.py tests/unit/test_kit_interop.py -v

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: ./.github/actions/setup-python
      - name: Pip audit
        run: uv run pip-audit
