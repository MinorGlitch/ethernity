name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag matching project version (e.g. v1.2.0 or v1.2.0b1)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create as draft"
        required: false
        type: boolean
        default: false
      ci_exception:
        description: "Prereleases only: reason to publish without green CI (shown in release notes)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  UV_LOCKED: "true"

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}
      published: ${{ steps.meta.outputs.published }}
      channels: ${{ steps.meta.outputs.channels }}
      environment: ${{ steps.meta.outputs.environment }}
      ci_exception: ${{ steps.meta.outputs.ci_exception }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: ./.github/actions/setup-python

      - name: Resolve release and verify CI policy
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease }}
          REQUESTED_DRAFT: ${{ inputs.draft }}
          REQUESTED_CI_EXCEPTION: ${{ inputs.ci_exception }}
        run: uv run python -m tooling.release.precheck

  existing-release:
    needs: precheck
    if: needs.precheck.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.precheck.outputs.commit_sha }}
      - uses: ./.github/actions/setup-python
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify existing release without rebuilding or replacing it
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.precheck.outputs.tag }}
          RELEASE_COMMIT_SHA: ${{ needs.precheck.outputs.commit_sha }}
        run: uv run python -m tooling.release.cli verify-published

  kit-bundles:
    if: needs.precheck.outputs.published != 'true'
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.precheck.outputs.commit_sha }}

      - name: Setup kit dependencies
        uses: ./.github/actions/setup-kit

      - name: Generate kit bundles
        working-directory: kit
        env:
          ETHERNITY_KIT_COMPRESSION: gzip
          ETHERNITY_KIT_VARIANTS: both
        run: |
          rm -f ../src/ethernity/resources/kit/recovery_kit*.bundle.html
          node build_kit.mjs

      - name: Verify generated kit bundles
        run: python3 -m tooling.release_resources --kit-directory src/ethernity/resources/kit

      - name: Upload kit bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-kit-bundles
          retention-days: 30
          if-no-files-found: error
          path: src/ethernity/resources/kit/*.html

  packages:
    needs: [precheck, kit-bundles]
    uses: ./.github/workflows/native-packages.yml
    with:
      commit_sha: ${{ needs.precheck.outputs.commit_sha }}
      tag: ${{ needs.precheck.outputs.tag }}
      kit_artifact: release-kit-bundles

  signatures:
    needs: [precheck, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.precheck.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.precheck.outputs.commit_sha }}
      - uses: ./.github/actions/setup-python

      - name: Download package files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-build-*
          merge-multiple: true
          path: release-files

      - name: Download tagged source archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source
          path: release-files

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-python
          path: release-files

      - name: Prepare installers and checksums from the verified archives
        run: uv run python -m tooling.release.installers --tag "${{ needs.precheck.outputs.tag }}" --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-installers
          retention-days: 30
          if-no-files-found: error
          path: |
            release-files/install.sh
            release-files/install.ps1
            release-files/SHA256SUMS
            release-files/MinorGlitch.Ethernity.yaml

      - name: Sign and verify release files
        env:
          RELEASE_TAG: ${{ needs.precheck.outputs.tag }}
        run: uv run python -m tooling.release.cli sign

      - name: Upload signature bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signatures
          retention-days: 30
          if-no-files-found: error
          path: release-files/*.sigstore.json

  release:
    needs: [precheck, signatures]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always() && needs.precheck.result == 'success' && needs.signatures.result == 'success'
    environment: ${{ needs.precheck.outputs.environment }}
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.precheck.outputs.commit_sha }}
          fetch-depth: 0

      - name: Download all release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-build-*
          merge-multiple: true
          path: release-files

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source
          path: release-files
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signatures
          path: release-files
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-python
          path: release-files
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-installers
          path: release-files

      - uses: ./.github/actions/setup-python

      - name: Publish release without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.precheck.outputs.tag }}
          RELEASE_COMMIT_SHA: ${{ needs.precheck.outputs.commit_sha }}
          RELEASE_PRERELEASE: ${{ needs.precheck.outputs.prerelease }}
          RELEASE_DRAFT: ${{ needs.precheck.outputs.draft }}
          RELEASE_CI_EXCEPTION: ${{ needs.precheck.outputs.ci_exception }}
        run: uv run python -m tooling.release.cli publish

  homebrew:
    needs: [precheck, release, existing-release]
    if: always() && !cancelled() && needs.precheck.outputs.channels == 'true' && (needs.release.result == 'success' || needs.existing-release.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      # GITHUB_TOKEN release events do not start downstream workflows. Explicit dispatch does.
      - name: Start Homebrew publication (also safe after a release retry)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.precheck.outputs.tag }}
        run: gh workflow run homebrew-tap.yml --repo "$GITHUB_REPOSITORY" --ref master -f release_tag="$RELEASE_TAG"

  pypi:
    needs: [precheck, release, existing-release]
    if: always() && !cancelled() && needs.precheck.outputs.channels == 'true' && (needs.release.result == 'success' || needs.existing-release.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.precheck.outputs.commit_sha }}
      - uses: ./.github/actions/setup-python
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify the published Python distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.precheck.outputs.tag }}
        run: uv run python -m tooling.release.python_package --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
      - name: Publish the same distributions to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ python-dist/*
