name: Verify Homebrew bottles

on:
  workflow_call:
    inputs:
      formula_artifact:
        required: true
        type: string
      tap_name:
        required: true
        type: string
      source_artifact:
        default: ""
        type: string

permissions:
  contents: read

jobs:
  bottles:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            id: macos-14
          - runner: ubuntu-24.04
            id: ubuntu-24.04
    steps:
      - name: Download exact staged formula
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.formula_artifact }}
          path: ${{ runner.temp }}/homebrew-stage

      - name: Download unpublished source for rehearsal
        if: inputs.source_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.source_artifact }}
          path: ${{ runner.temp }}/rehearsal-source

      - name: Configure Homebrew (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          echo "/home/linuxbrew/.linuxbrew/bin" >> "${GITHUB_PATH}"
          echo "/home/linuxbrew/.linuxbrew/sbin" >> "${GITHUB_PATH}"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew --version

      - name: Identify Homebrew caches
        id: cache
        shell: bash
        env:
          STAGE_DIR: ${{ runner.temp }}/homebrew-stage
        run: |
          set -euo pipefail
          brew_repo="$(brew --repository)"
          {
            echo "downloads=$(brew --cache)/downloads"
            echo "gems=${brew_repo}/Library/Homebrew/vendor/bundle"
            echo "brew_sha=$(git -C "$brew_repo" rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          python3 - "$brew_repo" <<'PY'
          import hashlib
          import os
          import re
          import sys
          from pathlib import Path

          library = Path(sys.argv[1]) / "Library/Homebrew"
          files = (library / "Gemfile.lock", library / "vendor/portable-ruby-version")
          gems_hash = hashlib.sha256(b"".join(path.read_bytes() for path in files)).hexdigest()
          formula = Path(os.environ["STAGE_DIR"]) / "Formula/ethernity.rb"
          # Exclude the top-level source URL/hash so code-only changes reuse downloads.
          resources = re.findall(
              r'^ {4,}(?:url|sha256) .+$', formula.read_text(encoding="utf-8"), re.MULTILINE
          )
          resources_hash = hashlib.sha256("\n".join(resources).encode()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"gems_hash={gems_hash}\n")
              output.write(f"resources_hash={resources_hash}\n")
          PY

      - name: Cache Homebrew Ruby tooling
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.gems }}
          key: brew-gems-${{ matrix.id }}-${{ runner.arch }}-${{ steps.cache.outputs.brew_sha }}-${{ steps.cache.outputs.gems_hash }}

      - name: Cache Homebrew downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.downloads }}
          key: brew-downloads-${{ matrix.id }}-${{ runner.arch }}-${{ steps.cache.outputs.brew_sha }}-${{ steps.cache.outputs.resources_hash }}
          restore-keys: |
            brew-downloads-${{ matrix.id }}-${{ runner.arch }}-

      - name: Create local read-only tap
        shell: bash
        env:
          STAGE_DIR: ${{ runner.temp }}/homebrew-stage
          LOCAL_TAP: ${{ runner.temp }}/local-tap
          TAP_NAME: ${{ inputs.tap_name }}
        run: |
          set -euo pipefail
          mkdir -p "${LOCAL_TAP}/Formula"
          cp "${STAGE_DIR}/Formula/ethernity.rb" "${LOCAL_TAP}/Formula/ethernity.rb"
          git -C "${LOCAL_TAP}" init --initial-branch=master
          git -C "${LOCAL_TAP}" add Formula/ethernity.rb
          git -C "${LOCAL_TAP}" \
            -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -m "staged formula"
          brew untap "${TAP_NAME}" || true
          brew tap "${TAP_NAME}" "file://${LOCAL_TAP}"

      - name: Install, test, and build bottle from staged formula
        shell: bash
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          TAP_NAME: ${{ inputs.tap_name }}
          BOTTLE_DIR: ${{ runner.temp }}/bottles
          REHEARSAL_SOURCE: ${{ inputs.source_artifact }}
          STAGE_DIR: ${{ runner.temp }}/homebrew-stage
        run: |
          set -euo pipefail
          formula_ref="${TAP_NAME}/ethernity"
          brew style "${formula_ref}"
          brew audit --strict "${formula_ref}"
          if [[ -n "$REHEARSAL_SOURCE" ]]; then
            source_files=("${RUNNER_TEMP}"/rehearsal-source/*.tar.gz)
            [[ "${#source_files[@]}" -eq 1 ]]
            cached_source="$(brew --cache --build-from-source "$formula_ref")"
            mkdir -p "$(dirname "$cached_source")"
            cp "${source_files[0]}" "$cached_source"
          fi
          # Hosted runners also contain python.org installations. Give the formula's
          # Homebrew Python ownership of its links on these disposable build machines.
          python_formula="$(brew deps --direct "$formula_ref" | sed -n '/^python@/p')"
          [[ -n "$python_formula" && "$python_formula" != *$'\n'* ]]
          brew install --overwrite "$python_formula"
          brew link --overwrite "$python_formula"
          "$(brew --prefix "$python_formula")/bin/${python_formula/@/}" -m pip --version
          brew uninstall --ignore-dependencies "${formula_ref}" || true
          brew install --build-bottle "${formula_ref}"
          brew test "${formula_ref}"
          mkdir -p "${BOTTLE_DIR}"
          cd "${BOTTLE_DIR}"
          brew bottle --json --no-rebuild "${formula_ref}"
          compgen -G 'ethernity--*.bottle.tar.gz' >/dev/null
          compgen -G 'ethernity--*.bottle.json' >/dev/null
          # Exercise the distributable bottle, including replacement and removal.
          # Keep all existing source-install, audit, and recovery checks above.
          bottle_files=(ethernity--*.bottle.tar.gz)
          [[ "${#bottle_files[@]}" -eq 1 ]]
          expected_version="$(ethernity --version)"
          brew uninstall "${formula_ref}"
          # Uninstall removes formula-specific trust. Restore it for this exact
          # staged formula before loading the bottle by path.
          brew trust --formula "${formula_ref}"
          # Homebrew 7 permits local bottle paths only in developer mode.
          # Scope it to these two commands; normal formula checks stay unchanged.
          HOMEBREW_DEVELOPER=1 brew install "./${bottle_files[0]}"
          [[ "$(ethernity --version)" == "$expected_version" ]]
          brew test "${formula_ref}"
          HOMEBREW_DEVELOPER=1 brew reinstall "./${bottle_files[0]}"
          [[ "$(ethernity --version)" == "$expected_version" ]]
          brew uninstall "${formula_ref}"
          command_path="$(brew --prefix)/bin/ethernity"
          [[ ! -e "$command_path" && ! -L "$command_path" ]]
          HOMEBREW_DEVELOPER=1 python3 "${STAGE_DIR}/tooling/check_homebrew_upgrade.py" \
            --formula "$formula_ref" --bottle "${bottle_files[0]}" \
            --expected-version "$expected_version"

      - name: Upload validated bottle files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/bottles/ethernity--*.bottle.tar.gz
            ${{ runner.temp }}/bottles/ethernity--*.bottle.json
          if-no-files-found: error
          retention-days: 30
