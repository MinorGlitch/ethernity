name: Verify native packages

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      tag:
        required: true
        type: string
      kit_artifact:
        required: true
        type: string

permissions:
  contents: read

env:
  UV_LOCKED: "true"

jobs:
  targets:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: ./.github/actions/setup-python
      - id: matrix
        run: echo "matrix=$(uv run python -m tooling.release.cli matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Setup build dependencies
        uses: ./.github/actions/setup-python
        with:
          extras: build
          dependency-groups: "false"

      - name: Download generated kit bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.kit_artifact }}
          path: src/ethernity/resources/kit

      - name: Verify exact generated kit bundles
        run: python -m tooling.release_resources --kit-directory src/ethernity/resources/kit

      - name: Build with PyInstaller (onedir)
        run: uv run --no-default-groups --extra build pyinstaller --clean --noconfirm ethernity.spec

      - name: Smoke test built executable and Linux baseline
        shell: bash
        env:
          TARGET_OS: ${{ matrix.target_os }}
        run: |
          args=("./dist/ethernity/ethernity")
          if [[ "$TARGET_OS" == "windows" ]]; then
            args=("./dist/ethernity/ethernity.exe")
          elif [[ "$TARGET_OS" == "linux" ]]; then
            args+=(--glibc-directory dist/ethernity)
          fi
          uv run --no-default-groups --extra build python -m tooling.release.smoke "${args[@]}"

      - name: Package release archive
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_OS: ${{ matrix.target_os }}
          TARGET_ARCH: ${{ matrix.target_arch }}
          RUNNER_ARCH: ${{ runner.arch }}
          PACKAGER: pyinstaller
          PACKAGE_MODE: onedir
        run: uv run --no-default-groups --extra build python -m scripts.package_pyinstaller

      - name: Verify installer lifecycle using the built archive
        if: matrix.target_os != 'macos'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_OS: ${{ matrix.target_os }}
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: uv run --no-default-groups --extra build python -m tooling.release.install_smoke

      - name: Install pinned Inno Setup compiler
        if: matrix.target_os == 'windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
          if ((Get-FileHash $download -Algorithm SHA256).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
            throw 'Inno Setup compiler checksum mismatch'
          }
          $directory = Join-Path $env:RUNNER_TEMP 'inno-setup'
          $install = Start-Process -FilePath $download -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$directory`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Inno Setup installation failed: $($install.ExitCode)" }
          "INNO_COMPILER=$directory/ISCC.exe" >> $env:GITHUB_ENV

      - name: Build desktop installer from the same PyInstaller output
        if: matrix.target_os == 'windows' || matrix.target_os == 'macos'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          args=(--tag "$RELEASE_TAG")
          if [[ -n "${INNO_COMPILER:-}" ]]; then args+=(--compiler "$INNO_COMPILER"); fi
          uv run --no-default-groups --extra build python -m tooling.release.desktop_packages "${args[@]}"

      - name: Verify desktop install, upgrade, uninstall and browser lifecycle
        if: matrix.target_os == 'windows' || matrix.target_os == 'macos'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          args=(--tag "$RELEASE_TAG")
          if [[ -n "${INNO_COMPILER:-}" ]]; then args+=(--compiler "$INNO_COMPILER"); fi
          uv run --no-default-groups --extra build python -m tooling.release.desktop_install_smoke "${args[@]}"

      - name: Generate archive SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ethernity-${{ inputs.tag }}-${{ matrix.target_os }}-${{ matrix.target_arch }}.${{ matrix.archive_ext }}
          format: cyclonedx-json
          output-file: ethernity-${{ inputs.tag }}-${{ matrix.target_os }}-${{ matrix.target_arch }}.sbom.cdx.json
          syft-version: v1.49.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Upload package files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-${{ matrix.target_os }}-${{ matrix.target_arch }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ethernity-${{ inputs.tag }}-${{ matrix.target_os }}-${{ matrix.target_arch }}.${{ matrix.archive_ext }}
            ethernity-${{ inputs.tag }}-${{ matrix.target_os }}-${{ matrix.target_arch }}.sbom.cdx.json
            ethernity-${{ inputs.tag }}-${{ matrix.target_os }}-${{ matrix.target_arch }}-setup.exe
            ethernity-${{ inputs.tag }}-${{ matrix.target_os }}-${{ matrix.target_arch }}.dmg

  winget:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: ./.github/actions/setup-python
        with:
          extras: build
          dependency-groups: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build-windows-x64
      - name: Install the pinned Microsoft WinGet client
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $release = 'https://github.com/microsoft/winget-cli/releases/download/v1.29.380'
          $directory = Join-Path $env:RUNNER_TEMP 'winget-client'
          New-Item -ItemType Directory -Path $directory | Out-Null
          $bundle = Join-Path $directory 'client.msixbundle'
          $dependencies = Join-Path $directory 'dependencies.zip'
          Invoke-WebRequest "$release/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle" -OutFile $bundle
          Invoke-WebRequest "$release/DesktopAppInstaller_Dependencies.zip" -OutFile $dependencies
          Expand-Archive $dependencies -DestinationPath "$directory/dependencies"
          $packages = @(Get-ChildItem "$directory/dependencies/x64" -Recurse -File |
            Where-Object { $_.Extension -in '.appx', '.msix' } |
            Select-Object -ExpandProperty FullName)
          if (-not $packages) { throw 'Missing WinGet x64 dependencies' }
          # Install the signed release directly. Repair can select a stale provisioned
          # bundle on Server 2025 instead of registering the requested x64 package.
          Add-AppxPackage -Path $bundle -DependencyPath $packages -ForceApplicationShutdown -ForceUpdateFromAnyVersion
          $appPath = Join-Path $env:LOCALAPPDATA 'Microsoft/WindowsApps'
          Add-Content $env:GITHUB_PATH $appPath
          if ((& "$appPath/winget.exe" --version) -ne 'v1.29.380') {
            throw 'Unexpected WinGet version'
          }
      - name: Verify WinGet with the same Windows archive
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: uv run --no-default-groups --extra build python -m tooling.release.winget_smoke
