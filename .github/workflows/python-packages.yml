name: Verify Python packages

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      tag:
        required: true
        type: string
      kit_artifact:
        required: true
        type: string
      stage_homebrew:
        type: boolean
        default: false

permissions:
  contents: read

env:
  UV_LOCKED: "true"

jobs:
  source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Setup build dependencies
        uses: ./.github/actions/setup-python
        with:
          extras: build
          dependency-groups: "false"

      - name: Download generated kit bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.kit_artifact }}
          path: src/ethernity/resources/kit

      - name: Verify exact source archive kit bundles
        run: python -m tooling.release_resources --kit-directory src/ethernity/resources/kit

      - name: Build tagged source archive
        shell: bash
        run: |
          set -euo pipefail
          uv build --no-build-isolation --sdist --out-dir source-dist
          mapfile -t archives < <(find source-dist -maxdepth 1 -type f -name '*.tar.gz')
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "expected exactly one source archive, found ${#archives[@]}" >&2
            exit 1
          fi
          mv "${archives[0]}" "ethernity-source-${{ inputs.tag }}.tar.gz"
          python -m tooling.release_resources "ethernity-source-${{ inputs.tag }}.tar.gz"

      - name: Generate source archive SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ethernity-source-${{ inputs.tag }}.tar.gz
          format: cyclonedx-json
          output-file: ethernity-source-${{ inputs.tag }}.sbom.cdx.json
          syft-version: v1.49.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Build and verify the Python wheel from the release source
        shell: bash
        run: |
          mkdir source-tree
          tar -xzf "ethernity-source-${{ inputs.tag }}.tar.gz" -C source-tree
          uv build --no-build-isolation --wheel source-tree/* --out-dir python-dist
          python -m tooling.release_resources python-dist/*.whl
          uv pip install --no-deps --reinstall python-dist/*.whl
          .venv/bin/python -m tooling.release.smoke "$PWD/.venv/bin/ethernity"

      - name: Upload verified Python wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-python
          retention-days: 30
          if-no-files-found: error
          path: python-dist/*.whl

      - name: Upload tagged source archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source
          retention-days: 30
          if-no-files-found: error
          path: |
            ethernity-source-${{ inputs.tag }}.tar.gz
            ethernity-source-${{ inputs.tag }}.sbom.cdx.json

      - name: Stage Homebrew formula from the verified source
        if: inputs.stage_homebrew
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/generate_homebrew_source_formula.py \
            --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --source-archive "ethernity-source-${RELEASE_TAG}.tar.gz" \
            --template scripts/homebrew_ethernity_tap.rb --lock uv.lock \
            --output homebrew-stage/Formula/ethernity.rb
          mkdir -p homebrew-stage/tooling
          cp scripts/check_homebrew_upgrade.py homebrew-stage/tooling/

      - name: Upload staged Homebrew formula
        if: inputs.stage_homebrew
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-rehearsal-formula
          path: homebrew-stage
          if-no-files-found: error
          retention-days: 30
