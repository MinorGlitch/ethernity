name: Setup Python with uv
description: Set up Python, uv, and install dependencies with caching

inputs:
  python-version:
    description: Python version to use
    required: false
    default: "3.11"
  extras:
    description: Extra dependencies to install (comma-separated)
    required: false
    default: "dev"
  dependency-groups:
    description: Install default dependency groups
    required: false
    default: "true"
  uv-version:
    description: Exact uv version to install
    required: false
    default: "0.11.31"

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      shell: bash
      env:
        INSTALL_GROUPS: ${{ inputs.dependency-groups }}
        EXTRAS_RAW: ${{ inputs.extras }}
      run: |
        set -euo pipefail
        cmd=(uv sync --locked)
        if [[ "$INSTALL_GROUPS" == "false" ]]; then
          cmd+=(--no-default-groups)
        fi
        echo "UV_LOCKED=true" >> "$GITHUB_ENV"
        extras_raw="$EXTRAS_RAW"
        IFS=',' read -r -a extras <<< "$extras_raw"
        for extra in "${extras[@]}"; do
          extra="${extra#"${extra%%[![:space:]]*}"}"
          extra="${extra%"${extra##*[![:space:]]}"}"
          if [[ -z "$extra" ]]; then
            continue
          fi
          cmd+=(--extra "$extra")
        done
        "${cmd[@]}"
