version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
      python-dependencies:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories: ["/kit", "/browser"]
    schedule:
      interval: "weekly"
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-dependencies:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
