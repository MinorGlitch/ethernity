[render]
style = "sentinel"

[page]
size = "A4" # Supported sizes are listed by the application.

[qr]
error = "M"
scale = 4
border = 0
kind = "png"
dark = "#000000"
light = "#ffffffff"
# Preferred ciphertext bytes per QR frame (smaller => more codes, easier scanning).
# This is an upper bound; the renderer may reduce it to fit the chosen QR settings.
chunk_size = 512

[extension.chunking]
# Advanced FastCDC defaults for the first update in a backup chain.
# Existing chains keep the profile authenticated by their first update.
# Smaller chunks can improve reuse after small edits but add more chunk metadata.
target_size = 16384
min_size = 4096
max_size = 65536

[defaults.backup]
# Leave as "" or 0 to keep built-in behavior.
# Example operator profile:
# base_dir = "/data/secrets"
# output_dir = "/data/backups"
# shard_threshold = 2
# shard_count = 3
# signing_key_mode = "sharded"
# signing_key_shard_threshold = 2
# signing_key_shard_count = 3
# payload_codec = "auto" # one of: auto | raw | gzip
# qr_payload_codec = "raw" # required: raw | base64
base_dir = ""
output_dir = ""
shard_threshold = 0
shard_count = 0
signing_key_mode = "" # embedded | sharded
signing_key_shard_threshold = 0
signing_key_shard_count = 0
payload_codec = "auto" # one of: auto | raw | gzip
qr_payload_codec = "raw" # required: raw | base64

[defaults.add_files]
# Extension input and QR transport defaults.
# base_dir = "/data/secrets"
# qr_payload_codec = "raw" # required: raw | base64
base_dir = ""
qr_payload_codec = "raw" # required: raw | base64

[defaults.recover]
# Default recover output path (file or directory).
# Example:
# output = "/data/recovered"
output = ""

[ui]
# One-way defaults: command flags can force true, but not force false.
quiet = false
no_color = false
no_animations = false
show_internals = false

[debug]
# Set to 0 to unset and fall back to the CLI default (1024).
max_bytes = 1024
