[render]
style = "sentinel"

[page]
size = "A4" # Supported: A4, Letter

[qr]
error = "M"
scale = 4
border = 0
kind = "png"
dark = "#000000"
light = "#ffffffff"
# Preferred ciphertext bytes per QR frame (smaller => more codes, easier scanning).
# This is an upper bound; the renderer may reduce it to fit the chosen QR settings.
chunk_size = 512

[extension.chunking]
# Content-defined chunking profile for the first extension in a new chain.
# Existing chains keep their locked profile, regardless of later config edits.
# Smaller values can improve reuse for text-heavy backups at the cost of more chunk metadata.
target_size = 16384
min_size = 4096
max_size = 65536

[defaults.backup]
# Leave as "" or 0 to keep built-in behavior.
# Example operator profile:
# base_dir = "/data/secrets"
# output_dir = "/data/backups"
# shard_threshold = 2
# shard_count = 3
# signing_key_mode = "sharded"
# signing_key_shard_threshold = 2
# signing_key_shard_count = 3
# payload_codec = "auto" # one of: auto | raw | gzip
# qr_payload_codec = "raw" # required: raw | base64
base_dir = ""
output_dir = ""
shard_threshold = 0
shard_count = 0
signing_key_mode = "" # embedded | sharded
signing_key_shard_threshold = 0
signing_key_shard_count = 0
payload_codec = "auto" # one of: auto | raw | gzip
qr_payload_codec = "raw" # required: raw | base64

[defaults.extend]
# Extension output policy defaults. Leave as "" or 0 to require explicit CLI/prompt choices
# or to inherit a compatible published root shard quorum when available.
# base_dir = "/data/secrets"
# unlock_policy = "self-contained" # self-contained | reuse-root
# shard_threshold = 2
# shard_count = 3
# signing_key_mode = "sharded" # not-stored | sharded
# signing_key_shard_threshold = 2
# signing_key_shard_count = 3
# qr_payload_codec = "raw" # required: raw | base64
base_dir = ""
unlock_policy = ""
shard_threshold = 0
shard_count = 0
signing_key_mode = ""
signing_key_shard_threshold = 0
signing_key_shard_count = 0
qr_payload_codec = "raw" # required: raw | base64

[defaults.recover]
# Default recover output path (file or directory).
# Example:
# output = "/data/recovered"
output = ""

[ui]
# One-way defaults: command flags can force true, but not force false.
quiet = false
no_color = false
no_animations = false

[debug]
# Set to 0 to unset and fall back to the CLI default (1024).
max_bytes = 1024

[runtime]
# "auto" or a positive integer. ETHERNITY_RENDER_JOBS env still takes precedence.
render_jobs = "auto"
