[project]
name = "ethernity-paper"
version = "1.2.0"
description = "Secure, offline-recoverable backup system with QR-based recovery documents"
readme = { file = "README_PYPI.md", content-type = "text/markdown" }
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
keywords = ["backup", "recovery", "qr-code", "encryption", "offline", "paper-backup"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Archiving :: Backup",
    "Typing :: Typed",
]
dependencies = [
    "cbor2>=6.1.3",
    "click>=8.4.2",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "markdown-it-py>=4.0.0,<5.0.0",
    "textual>=8.2.8,<9.0.0",
    "platformdirs>=4.10.0",
    "psutil>=7.2.2,<8.0.0",
    "fpdf2>=2.8.7",
    "fonttools>=4.34.0",
    "pycryptodome>=3.23.0,<3.24.0",
    "pillow>=12.3.0",
    "pypdf>=6.19.0",
    "segno>=1.6.6",
    "zxing-cpp==3.1.0",
    "pyrage>=1.3.0",
    "pypdfium2>=5.13.0,<6.0.0",
]

[project.scripts]
ethernity = "ethernity.main:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.19.0"]
dev = [
    "coverage>=7.13.4",
    "hypothesis>=6.151.9",
    "pip-audit>=2.10.0",
    "pre-commit>=4.5.1",
    "pylint>=4.1.2",
    "pyrefly>=1.1.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.2",
    "tkinterdnd2>=0.4.3",
    "typos>=1.44.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["ethernity", "ethernity.*"]

[tool.setuptools.package-data]
ethernity = [
    "resources/designs/_shared/assets/*.ttf",
    "resources/designs/_shared/assets/fonts/*.ttf",
    "resources/designs/_shared/assets/fonts/*.txt",
    "resources/designs/*/design.json",
    "resources/designs/*/style.json",
    "resources/designs/_shared/*.json",
    "app/*.tcss",
    "resources/config/*.toml",
    "resources/kit/recovery_kit.bundle.html",
    "resources/kit/recovery_kit.scanner.bundle.html",
    "resources/kit/recovery_kit.assembler.html",
    "resources/crypto/bip39_wordlist.txt",
    "py.typed",
]

[tool.uv]
required-version = "==0.11.31"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "I",
    "B",       # Common mistakes, including mutable defaults and loop-variable closures.
    "UP",      # Syntax supported by our minimum Python version.
    "RET505",  # Unnecessary else after return.
    "RUF100",  # Unused noqa comments.
    "C901",    # Complex control flow.
    "PLR0912", # Too many branches.
    "PLR0915", # Too many statements.
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.pylint.main]
recursive = true
persistent = false
py-version = "3.11"

[tool.pylint.messages_control]
disable = ["all"]
enable = ["duplicate-code", "too-many-nested-blocks"]

[tool.pylint.reports]
score = false

[tool.pyrefly]
project-includes = ["src", "tooling"]
project-excludes = [
    "**/__pycache__",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    "kit/node_modules",
    "kit/dist",
    "src/ethernity.egg-info",
    "src/ethernity_paper.egg-info",
    "src/.claude",
]
search-path = ["src", "tooling"]
python-version = "3.11.0"
preset = "default"
ignore-missing-imports = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
junit_duration_report = "total"
markers = ["portability: fast native-platform filesystem, process, and UI checks"]

[tool.coverage.run]
source = ["src/ethernity"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]
show_missing = true

[dependency-groups]
dev = [
    "coverage==7.15.0",
    "hypothesis==6.156.1",
    "pip-audit==2.10.1",
    "pre-commit==4.6.0",
    "pylint==4.1.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.15.20",
    "tkinterdnd2==0.6.2",
    "typos==1.48.0",
]
