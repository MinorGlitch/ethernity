[project]
name = "ethernity-paper"
version = "1.2.0"
description = "Secure, offline-recoverable backup system with QR-based recovery documents"
readme = { file = "README_PYPI.md", content-type = "text/markdown" }
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
keywords = ["backup", "recovery", "qr-code", "encryption", "offline", "paper-backup"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Archiving :: Backup",
    "Typing :: Typed",
]
dependencies = [
    "cbor2>=6.1.3",
    "click>=8.4.2",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "textual>=6.0.0",
    "platformdirs>=4.10.0",
    "fpdf2>=2.8.7",
    "pycryptodome>=3.23.0,<3.24.0",
    "pillow>=12.3.0",
    "pypdf>=6.14.2",
    "segno>=1.6.6",
    "zxing-cpp>=3.0.0",
    "pyrage>=1.3.0",
    "python-docx>=1.2.0",
    "pytest==9.1.1",
    "typos==1.48.0",
    "coverage==7.15.0",
    "debugpy==1.8.21",
    "hypothesis==6.156.1",
]

[project.scripts]
ethernity = "ethernity.main:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.19.0"]
dev = [
    "coverage>=7.13.4",
    "hypothesis>=6.151.9",
    "jsonschema>=4.25.1",
    "pip-audit>=2.10.0",
    "pre-commit>=4.5.1",
    "pyrefly>=1.1.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.2",
    "tkinterdnd2>=0.4.3",
    "typos>=1.44.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ethernity", "ethernity.*"]

[tool.setuptools.package-data]
ethernity = [
    "resources/templates/_shared/assets/*.ttf",
    "resources/templates/_shared/assets/fonts/*.otf",
    "resources/templates/_shared/assets/fonts/*.ttf",
    "resources/templates/*/design.json",
    "resources/templates/*/style.json",
    "app/*.tcss",
    "resources/storage/*.png",
    "resources/config/*.toml",
    "resources/kit/*.html",
    "resources/crypto/bip39_wordlist.txt",
    "py.typed",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pyrefly]
project-includes = ["src", "tooling"]
project-excludes = [
    "**/__pycache__",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    "kit/node_modules",
    "kit/dist",
    "src/ethernity.egg-info",
    "src/ethernity_paper.egg-info",
    "src/.claude",
]
search-path = ["src", "tooling"]
python-version = "3.11.0"
preset = "default"
ignore-missing-imports = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["src/ethernity"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true

[dependency-groups]
dev = [
    "debugpy>=1.8.20",
    "jsonschema>=4.25.1",
    "tkinterdnd2>=0.4.3",
    "twine>=6.2.0",
]
